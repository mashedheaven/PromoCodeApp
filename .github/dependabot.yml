version: 2
updates:
  # Library and plugin versions in PromoCodeApp/gradle/libs.versions.toml.
  - package-ecosystem: gradle
    directory: /PromoCodeApp
    schedule:
      interval: weekly
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*", "org.jetbrains.kotlinx*"]
      google:
        patterns: ["com.google.*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
